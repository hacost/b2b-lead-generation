[project]
name = "shared-contracts"
version = "0.1.0"
description = "DTOs Pydantic compartidos entre apps del monorepo (Job, JobResult, mensajes WebSocket) — build-time only, sin conexión viva entre apps en producción"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared_contracts"]
