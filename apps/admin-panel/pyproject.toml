[project]
name = "admin-panel"
version = "0.1.0"
description = "Panel de administración de un solo operador — Flet web, rol admin exclusivamente"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flet>=0.24",
    "shared-contracts",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv.sources]
shared-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/admin_panel"]
