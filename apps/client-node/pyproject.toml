[project]
name = "client-node"
version = "0.1.0"
description = "Client Node — ventana Flet (búsqueda + resultados) y ejecutor local del Scraper Engine (Playwright)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flet>=0.24",
    "playwright>=1.48",
    "shared-contracts",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-playwright>=0.6",
]

[tool.uv.sources]
shared-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/client_node"]
